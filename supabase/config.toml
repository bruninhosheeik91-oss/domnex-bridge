# Minimal Supabase config for DOMNEX BRIDGE deploy.
# O restante da configuração é gerenciado no projeto hospedado (via
# `supabase link` / dashboard). Este arquivo existe para fixar flags de
# deploy das Edge Functions, como `verify_jwt`.

# Projeto Supabase vinculado (ver supabase/.temp/linked-project.json).
project_id = "bknttvuiqsrkftodcsku"

# ---------------------------------------------------------------------------
# Edge Functions: DOMNEX BRIDGE
# ---------------------------------------------------------------------------

# bridge-provisioning: reprovisionamento automático do Bridge após
# reinstalação. Mesmo motivo do bridge-monitoring-proxy:
# verify_jwt = false — intencional e seguro.
#
#   O projeto DOMNEX BRIDGE emite tokens com as NOVAS chaves de assinatura
#   assimétricas (RS256), que o check legado do gateway (verify_jwt = true)
#   NÃO reconhece — causando 401 "Invalid JWT" ANTES do código executar.
#   A autenticação é feita 100% DENTRO da função, fail-closed:
#     - sem 'Authorization: Bearer'          -> 401 UNAUTHENTICATED
#     - JWT inválido (auth.getUser falha)    -> 401 UNAUTHENTICATED
#     - bridge_profiles inexistente          -> 403 PROFILE_MISSING
#     - status != ACTIVE (PENDING/SUSPENDED) -> 403 FORBIDDEN
#     - somente então devolve a config do cliente (via service_role no backend)
#   Isso torna a função NÃO pública: só um usuário real ACTIVE do projeto
#   bknttvuiqsrkftodcsku, com JWT válido, obtém a própria configuração.
[functions.bridge-provisioning]
verify_jwt = false

# bridge-monitoring-proxy: proxy server-to-server para o monitoramento do CFI.
#
# verify_jwt = false — intencional e seguro:
#   O projeto DOMNEX BRIDGE emite tokens com as NOVAS chaves de assinatura
#   assimétricas (RS256), que o check legado do gateway (verify_jwt = true)
#   NÃO reconhece — causando 401 "Invalid JWT" ANTES do código executar. Por
#   isso o check embutido do gateway é desligado aqui.
#
#   A autenticação passa a ser feita 100% DENTRO da função, fail-closed:
#     - sem 'Authorization: Bearer'          -> 401 UNAUTHENTICATED
#     - JWT inválido (auth.getUser falha)    -> 401 UNAUTHENTICATED
#     - bridge_profiles inexistente          -> 403 PROFILE_MISSING
#     - role != DOMNEX_ADMIN ou status != ACTIVE -> 403 FORBIDDEN
#     - somente então chama o CFI via M2M_MONITORING_SECRET
#   Isso torna a função NÃO pública: só um DOMNEX_ADMIN ACTIVE do projeto
#   bknttvuiqsrkftodcsku, com JWT válido, obtém resposta.
[functions.bridge-monitoring-proxy]
verify_jwt = false
